[package]
name = "local-agent"
version = "0.3.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Guardianec/local-agent"
description = "Windows local coding agent with controlled tools and reviewable changes"
rust-version = "1.88"

[lib]
name = "local_agent_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
ignore = "0.4"
regex = "1"
similar = "2"
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl"] }
schemars = "0.8"
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
