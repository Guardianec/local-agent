name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local-data/browsers
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            browser-helper/package-lock.json
      - name: Install Rust and dependencies
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.1
          npm ci
          npm ci --prefix browser-helper
          node browser-helper/node_modules/playwright-core/cli.js install chromium --no-shell
      - name: Privacy, versions and links
        run: node scripts/check-release.mjs
      - name: Secret scan (official checksum-verified Gitleaks)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '8.30.1'
          $name = "gitleaks_${version}_windows_x64.zip"
          $base = "https://github.com/gitleaks/gitleaks/releases/download/v$version"
          New-Item -ItemType Directory -Force .local-data/gitleaks | Out-Null
          Invoke-WebRequest "$base/$name" -OutFile ".local-data/$name"
          Invoke-WebRequest "$base/gitleaks_${version}_checksums.txt" -OutFile .local-data/gitleaks-checksums.txt
          $line = (Get-Content .local-data/gitleaks-checksums.txt | Where-Object { (($_.Trim() -split '\s+')[-1]).TrimStart('*') -eq $name })
          if (!$line) { throw 'Missing official scanner checksum' }
          $expected = ($line -split '\s+')[0]
          if ((Get-FileHash ".local-data/$name" -Algorithm SHA256).Hash -ne $expected) { throw 'Scanner checksum mismatch' }
          Expand-Archive ".local-data/$name" .local-data/gitleaks -Force
          .local-data/gitleaks/gitleaks.exe git --redact=100 --no-banner
          if ($LASTEXITCODE -ne 0) { throw 'Secret scan failed' }
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run build
